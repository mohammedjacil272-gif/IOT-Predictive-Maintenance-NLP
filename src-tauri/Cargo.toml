[package]
name = "iot-predictive-maintenance"
version = "0.1.0"
description = "Industrial predictive maintenance desktop console"
authors = ["IoT Integrated"]
edition = "2021"

[lib]
name = "iot_predictive_maintenance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
